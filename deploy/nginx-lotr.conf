# nginx — front statique + proxy boardgame.io (HTTP puis HTTPS via certbot)
# Domaine : lotr-tcg-online.raphael-bigot.info

upstream lotr_bgio {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lotr-tcg-online.raphael-bigot.info;

    root /var/www/lotr-tcg/dist;
    index index.html;

    # API + Socket.IO → Node
    location /games {
        proxy_pass http://lotr_bgio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://lotr_bgio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Assets statiques : 404 si absent (évite de renvoyer index.html en 200)
    location ^~ /interface/ {
        try_files $uri =404;
    }
    location ^~ /cards_visuals/ {
        try_files $uri =404;
    }
    location ^~ /audio/ {
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        try_files $uri =404;
    }
    location ^~ /avatars/ {
        try_files $uri =404;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
